<!-- webR Interactive R Exercise Cells -->
<!-- Loaded via _output.yml in_header for bookdown::gitbook -->

<style>
/* ── Loading indicator ── */
#webr-loading-indicator {
  position: fixed;
  bottom: 0;
  right: 0;
  font-size: 0.85rem;
  padding: 0.2rem 0.6rem;
  border: 1px solid #dee2e6;
  background-color: #f8f8f8;
  border-top-left-radius: 5px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  color: #212529;
  font-family: sans-serif;
}
#webr-loading-indicator.webr-ready { display: none; }
#webr-loading-indicator.webr-error {
  background-color: #f8d7da;
  border-color: #f1aeb5;
  color: #58151c;
}

/* ── Exercise card ── */
.webr-exercise {
  margin: 0.5rem 0;
  border: 1px solid rgba(0,0,0,0.175);
  border-radius: 0.375rem;
  overflow: hidden;
  font-family: sans-serif;
  font-size: 0.85em;
  background: #fff;
}

/* ── Card header ── */
.webr-exercise-header {
  padding: 0.25rem 0.6rem;
  background-color: #f8f8f8;
  border-bottom: 1px solid rgba(0,0,0,0.175);
  font-weight: 600;
  color: #212529;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.4rem;
}

.webr-btn-group {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  flex-shrink: 0;
}

/* ── Run button ── */
.webr-run-btn {
  padding: 0.1rem 0.5rem;
  font-size: 0.8em;
  color: #fff;
  background-color: #0d6efd;
  border: 1px solid #0d6efd;
  border-radius: 0.3rem;
  cursor: pointer;
  font-family: sans-serif;
  white-space: nowrap;
  transition: background-color 0.15s;
}
.webr-run-btn:hover:not(:disabled) { background-color: #0b5ed7; }
.webr-run-btn:disabled { opacity: 0.65; cursor: not-allowed; }

/* ── Reset button ── */
.webr-reset-btn {
  padding: 0.1rem 0.5rem;
  font-size: 0.8em;
  color: #6c757d;
  background-color: transparent;
  border: 1px solid #6c757d;
  border-radius: 0.3rem;
  cursor: pointer;
  font-family: sans-serif;
  white-space: nowrap;
  transition: background-color 0.15s, color 0.15s;
}
.webr-reset-btn:hover { background-color: #6c757d; color: #fff; }

/* ── Textarea code editor ── */
.webr-editor {
  display: block;
  width: 100%;
  box-sizing: border-box;
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  font-size: 12px;
  line-height: 1.5;
  padding: 0.4rem 0.6rem;
  background: #fff;
  color: #212529;
  border: none;
  border-bottom: 1px solid #dee2e6;
  resize: vertical;
  outline: none;
  overflow: auto;
}
.webr-editor:focus {
  background: #fafcff;
}

/* ── Hide original controls (moved to header by JS) ── */
.webr-controls { display: none; }

/* ── Output area ── */
.webr-output-area {
  padding: 0.3rem 0.6rem;
  background: #fff;
  color: #212529;
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  border-top: 1px solid #dee2e6;
  display: none;
}
.webr-output-area.webr-has-output { display: block; }
.webr-output-area.webr-error-output { color: #ad0000; background: #fff8f8; }

/* ── Plot area ── */
.webr-canvas-area {
  padding: 0.5rem;
  background: #fff;
  text-align: center;
  display: none;
  border-top: 1px solid #dee2e6;
}
.webr-canvas-area.webr-has-plot { display: block; }
.webr-canvas-area canvas {
  max-width: 100%;
  border: 1px solid #dee2e6;
  border-radius: 0.25rem;
}
</style>

<div id="webr-loading-indicator">
  <span id="webr-loading-text">⏳ Loading R engine…</span>
</div>

<script type="module">
import { WebR } from 'https://webr.r-wasm.org/latest/webr.mjs';

let webR;
let webRReady = false;

const indicator     = document.getElementById('webr-loading-indicator');
const indicatorText = document.getElementById('webr-loading-text');

function setStatus(msg, cssClass) {
  if (!indicator) return;
  indicatorText.textContent = msg;
  indicator.className = cssClass || '';
}

async function initWebR() {

    await webR.evalRVoid('suppressMessages(library(ggplot2))');

    // Inline CSV data — no fetch() needed, works with file:// and http://

      'ch8-study-methods.csv': `method,score\nLecture,68\nLecture,71\nLecture,75\nLecture,70\nLecture,74\nLecture,77\nLecture,69\nLecture,73\nOnline,72\nOnline,78\nOnline,80\nOnline,75\nOnline,77\nOnline,79\nOnline,74\nOnline,81\nOnline,76\nOnline,77\nGroup,77\nGroup,82\nGroup,84\nGroup,79\nGroup,81\nGroup,83\nGroup,78\nGroup,86\nGroup,80\nGroup,83\nGroup,85\nGroup,82\nTutor,81\nTutor,88\nTutor,90\nTutor,85\nTutor,87\nTutor,91\nTutor,83\nTutor,89\nTutor,86\nSelfStudy,70\nSelfStudy,75\nSelfStudy,78\nSelfStudy,72\nSelfStudy,74\nSelfStudy,77\nSelfStudy,71\nSelfStudy,76\nSelfStudy,73\nSelfStudy,75\nSelfStudy,74`,

    };
    const enc = new TextEncoder();
    for (const [fname, content] of Object.entries(csvData)) {
      await webR.FS.writeFile('/home/web_user/' + fname, enc.encode(content));
    }

    webRReady = true;
    setStatus('', 'webr-ready');
    document.querySelectorAll('.webr-run-btn').forEach(btn => {
      btn.disabled = false;
      btn.textContent = '▶ Run';
    });
  } catch (e) {
    setStatus('❌ Failed to load R: ' + e.message, 'webr-error');
  }
}

function setupCell(cell) {
  const textarea  = cell.querySelector('.webr-editor');
  const runBtn    = cell.querySelector('.webr-run-btn');
  const resetBtn  = cell.querySelector('.webr-reset-btn');
  const outArea   = cell.querySelector('.webr-output-area');
  const canvasDiv = cell.querySelector('.webr-canvas-area');
  const canvas    = canvasDiv ? canvasDiv.querySelector('canvas') : null;
  const header    = cell.querySelector('.webr-exercise-header');
  const origCode  = textarea.value;

  // Auto-size textarea to content
  function fitHeight() {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
  }
  fitHeight();
  textarea.addEventListener('input', fitHeight);

  // Move buttons into header
  const btnGroup = document.createElement('div');
  btnGroup.className = 'webr-btn-group';
  btnGroup.appendChild(runBtn);
  btnGroup.appendChild(resetBtn);
  header.appendChild(btnGroup);

  // Reset
  resetBtn.addEventListener('click', () => {
    textarea.value = origCode;
    fitHeight();
    outArea.textContent = '';
    outArea.className = 'webr-output-area';
    if (canvasDiv) canvasDiv.className = 'webr-canvas-area';
  });

  // Run
  runBtn.addEventListener('click', async () => {
    if (!webRReady) return;
    runBtn.disabled = true;
    runBtn.textContent = '⏳';
    outArea.textContent = '';
    outArea.className = 'webr-output-area';
    if (canvasDiv) canvasDiv.className = 'webr-canvas-area';

    try {
      const code = textarea.value;
      const shelter = await new webR.Shelter();
      const captureOpts = { withAutoprint: true };
      if (canvas) captureOpts.captureGraphics = { width: 504, height: 378, bg: 'white' };

      const result = await shelter.captureR(code, captureOpts);
      await shelter.purge();

      const lines = result.output
        .filter(x => x.type === 'stdout' || x.type === 'message')
        .map(x => x.data)
        .join('\n')
        .trimEnd();

      if (lines) {
        outArea.textContent = lines;
        outArea.classList.add('webr-has-output');
      }

      if (canvas && result.images && result.images.length > 0) {
        canvasDiv.classList.add('webr-has-plot');
        const ctx = canvas.getContext('2d');
        canvas.width = 504; canvas.height = 378;
        ctx.clearRect(0, 0, 504, 378);
        for (const img of result.images) ctx.drawImage(img, 0, 0, 504, 378);
      }
    } catch (e) {
      outArea.textContent = 'Error: ' + e.message;
      outArea.classList.add('webr-has-output', 'webr-error-output');
    }

    runBtn.disabled = false;
    runBtn.textContent = '▶ Run';
  });
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.webr-exercise').forEach(setupCell);
  initWebR();
});
</script>
